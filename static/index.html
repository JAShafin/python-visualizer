<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Python Compiler</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>

<body>
  <header>
    <h1>Python Web Compiler</h1>
    <button id="run-btn" class="primary-btn">Run Code ▶</button>
  </header>

  <main class="container">
    <!-- LEFT COLUMN: Code and Inputs -->
    <div class="left-column">
      <h3>main.py</h3>
      <textarea id="code-input" placeholder="Write Python code here..."></textarea>

      <h3>Standard Input (stdin)</h3>
      <textarea id="program-inputs" class="small-box"
        placeholder="If your code uses input(), type the values here (one per line)..."></textarea>
    </div>

    <!-- RIGHT COLUMN: Console Output -->
    <div class="right-column">
      <h3>Console Output</h3>
      <pre id="terminal-display">Click 'Run Code' to see output...</pre>
    </div>
  </main>

  <script src="/static/app.js"></script>
</body>

</html>
