<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Visualizer MVP</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>

<body>
  <header>
    <h1>Python Visualizer MVP</h1>
    <p>Paste Python code, run a safe trace, and step through execution.</p>
  </header>

  <main class="container">
    <!-- LEFT COLUMN: Code, Inputs, Buttons, and Black Window -->
    <div class="left-column">
      <div class="input-section">
        <label for="code-input"><strong>Python code</strong></label>
        <textarea id="code-input" rows="12" placeholder="Type your Python code here..."></textarea>
      </div>

      <div class="input-section">
        <label for="program-inputs"><strong>Program input</strong> (One value per line)</label>
        <textarea id="program-inputs" rows="3" placeholder="Enter inputs here (e.g. rock)"></textarea>
      </div>

      <div class="controls">
        <button id="run-btn" class="primary-btn">Run Trace</button>
        <button id="prev-btn">Previous</button>
        <button id="next-btn">Next</button>
        <button id="reset-btn">Reset</button>
      </div>

      <div class="timeline-container">
        <label for="timeline">Timeline: </label>
        <input type="range" id="timeline" min="0" value="0">
      </div>

      <div class="visualizer-window">
        <h3>Code Line Sync</h3>
        <pre id="code-display" class="black-window">Run a trace to see code execution...</pre>
      </div>
    </div>

    <!-- RIGHT COLUMN: Explanations and Outputs -->
    <div class="right-column">
      <h3>Call Stack</h3>
      <div id="call-stack-display" class="data-box">Main</div>

      <h3>Explanation</h3>
      <!-- This replaces the weird Variables table -->
      <div id="explanation-display" class="data-box explanation-text">
        Waiting for trace to begin...
      </div>

      <h3>Output</h3>
      <pre id="output-display" class="data-box"></pre>

      <h3>Errors</h3>
      <pre id="error-display" class="data-box error-text"></pre>
    </div>
  </main>

  <script src="/static/app.js"></script>
</body>

</html>
